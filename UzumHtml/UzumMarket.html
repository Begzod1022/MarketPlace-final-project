<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Place</title>
    <link rel="stylesheet" href="/UzumCSS/UzumMarket.css">
    <link rel="stylesheet" href="/UzumCSS/font.css">
</head>
<body>

    <header class="header">
        <div class="logotypeAndCatalogue">
            <div class="logotypeDiv">
                <img src="/images/" alt="">
            </div>
            <button class="CatalogueButton">
                <span>Каталог</span>
            </button>
        </div>
        <div class="SearchBar">
            <input type="text" placeholder="Поиск">
        </div>
        <div class="UserActions">
            <a href="">
                <div class="userAccout">
                    <img src="/images/User Img Coding.png" alt="" class="header__icon">
                    <span>Войти</span>
                </div>
            </a>
            <a href="">
                <div class="orders">
                    <img src="/images/Orders Img Coding.png" alt="" class="header__icon">
                    <span>Заказы</span>
                </div>
            </a>
            <a href="">
                <div class="korzina">
                    <img src="/images/Korzinka img Coding.png" alt="" class="header__icon">
                    <span>Корзинка</span>
                </div>
            </a>
            <a href="">
                <div class="favorites">
                    <img src="/images/Favorite img Coding.png" alt="" class="header__icon">
                    <span>Избранное</span>
                </div>
            </a>
        </div>
    </header>
    <div class="locationAndlanguageDiv">
        <div class="locationAndLanguage">
            <span class="city">Москва</span>
            <span>•</span>
            <a href="" class="changeCityA">
                <span class="changeCity">Изменить город</span>
            </a>
            <span>•</span>
            <div class="language">
                <div class="lang_picker">
                    <img src="https://flagcdn.com/w20/ru.png" alt="RU" class="flag-icon">
                    <span class="lang-text">RU</span>
                </div>
            </div>
        </div>
    </div>
    <div class="bannerAfterheader">
        <div class="arrowsBanner">
            <button class="leftArrow">
                <img src="/images/Left Arrow Banner.png" alt="">
            </button>
            <button class="rightArrow">
                <img src="/images/Right Arrow Banner.png" alt="">
            </button>
        </div>
    </div>
    <div class="RecomendationsItemsToBuy">
        <h2>Рекомендации для вас</h2>
    </div>
</body>
</html>
